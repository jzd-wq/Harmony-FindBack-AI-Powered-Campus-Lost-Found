limit_req_zone $binary_remote_addr zone=shiguang_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=shiguang_ai:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location ~ ^/api/v1/items/[^/]+/(analyze|matches)$ {
        limit_req zone=shiguang_ai burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        limit_req zone=shiguang_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
